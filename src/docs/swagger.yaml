openapi: 3.0.3
info:
  title: Secured RESTful CRUD API Server
  description: >
    Production-grade scalable RESTful CRUD API server built with Node.js, Express,
    TypeScript, and an active SQL relational database via Prisma ORM.
    Features robust validation middleware (Zod), JWT authentication, role-based access control (RBAC),
    atomic transactions, rate-limiting, and comprehensive error handling.
  version: 1.0.0
servers:
  - url: http://localhost:4000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT Bearer token obtained from /api/v1/auth/login or /api/v1/auth/register

  schemas:
    StandardSuccess:
      type: object
      properties:
        status:
          type: string
          example: success
        statusCode:
          type: integer
          example: 200
        message:
          type: string
        data:
          type: object

    StandardError:
      type: object
      properties:
        status:
          type: string
          example: fail
        statusCode:
          type: integer
          example: 400
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        createdAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        sku:
          type: string
        categoryId:
          type: string
          format: uuid
        creatorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      summary: Health check & Active SQL database ping
      tags: [System]
      responses:
        200:
          description: Server and SQL database are healthy and active
        503:
          description: Server or database is degraded/disconnected

  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: P@ssword123
                name:
                  type: string
                  example: Alex Developer
                role:
                  type: string
                  enum: [USER, ADMIN]
                  default: USER
      responses:
        201:
          description: User registered successfully
        400:
          description: Validation error
        409:
          description: Email already registered

  /api/v1/auth/login:
    post:
      summary: Authenticate user & receive JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: P@ssword123
      responses:
        200:
          description: Successfully authenticated
        401:
          description: Invalid email or password

  /api/v1/auth/me:
    get:
      summary: Get currently authenticated user profile
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile
        401:
          description: Unauthorized

  /api/v1/categories:
    get:
      summary: List all categories with pagination and product counts
      tags: [Categories]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        200:
          description: Paginated category list
    post:
      summary: Create a new category (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Cloud Infrastructure
                slug:
                  type: string
                  example: cloud-infrastructure
                description:
                  type: string
                  example: Scalable serverless and cloud compute services
      responses:
        201:
          description: Category created
        403:
          description: Forbidden (Admin role required)

  /api/v1/categories/{id}:
    get:
      summary: Get category by UUID
      tags: [Categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Category details
        404:
          description: Not found
    put:
      summary: Update category (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        200:
          description: Category updated
        403:
          description: Forbidden
    delete:
      summary: Delete category (Admin only; rejects if products attached)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Category deleted
        400:
          description: Cannot delete category with active products
        403:
          description: Forbidden

  /api/v1/products:
    get:
      summary: Query and filter products (Supports pagination, search, status, price range)
      tags: [Products]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ACTIVE, ARCHIVED]
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
      responses:
        200:
          description: Paginated product list
    post:
      summary: Create a product (Secured; requires authentication)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, price, sku, categoryId]
              properties:
                title:
                  type: string
                  example: High-Performance Database Node
                description:
                  type: string
                  example: Dedicated NVMe relational SQL cluster
                price:
                  type: number
                  example: 149.99
                stock:
                  type: integer
                  example: 25
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, ARCHIVED]
                  default: DRAFT
                sku:
                  type: string
                  example: DB-NVME-001
                categoryId:
                  type: string
                  format: uuid
      responses:
        201:
          description: Product created and audit logged
        400:
          description: Validation failure or non-existent category
        401:
          description: Unauthorized
        409:
          description: SKU or slug already exists

  /api/v1/products/{id}:
    get:
      summary: Get product by UUID (Includes relational category and creator details)
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Product details
        404:
          description: Product not found
    put:
      summary: Fully update product (Secured; Creator or Admin)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, ARCHIVED]
      responses:
        200:
          description: Product updated and audit logged
        403:
          description: Forbidden (Not creator or admin)
    patch:
      summary: Partially update product (Secured; Creator or Admin)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                price:
                  type: number
                stock:
                  type: integer
      responses:
        200:
          description: Product partially updated
    delete:
      summary: Delete product (Secured; Creator or Admin)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Product deleted and audit logged
        403:
          description: Forbidden
